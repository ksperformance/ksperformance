function pnPubDay(did){const p=planW(plCur);if(!p)return;S.pubP=S.pubP||{};const old=S.pubP[p.id],oldD={};if(old)old.weeks.forEach(w=>w.days.forEach(x=>oldD[x.id]=x));const nw=JSON.parse(JSON.stringify(p));nw.weeks.forEach(w=>{w.days=w.days.filter(d=>d.id===did||oldD[d.id]).map(d=>d.id===did?d:JSON.parse(JSON.stringify(oldD[d.id])))});S.pubP[p.id]=planNorm(nw);dyOk[did]=true;render()}
function pnSave(){save();msg='Zapisano zmiany w planie (wersja robocza'+(pnSt(planW(plCur))==='ok'?'':' – zawodnicy jej jeszcze nie widzą')+').';render()}
function pnPub(pid){const p=planW(pid);if(!p)return;const g=grp(p.team);ask('Zatwierdzić plan „'+p.n+'” '+(g?'dla drużyny '+g.name:'')+'? Od tej chwili zawodnicy zobaczą jego aktualną wersję.',()=>{S.pubP=S.pubP||{};S.pubP[pid]=planNorm(JSON.parse(JSON.stringify(p)));pmClose();msg='Plan „'+p.n+'” został zatwierdzony i jest widoczny dla zawodników.';render()})}
function pnRev(pid){const p=planW(pid);if(!p||!S.pubP||!S.pubP[pid])return;ask('Cofnąć wszystkie niezatwierdzone zmiany w planie „'+p.n+'” do ostatniej opublikowanej wersji?',()=>{const i=S.plans.indexOf(p);S.plans[i]=planNorm(JSON.parse(JSON.stringify(S.pubP[pid])));pmClose();msg='Przywrócono opublikowaną wersję planu.';render()})}
const memPlan=m=>plan(m.plan)||(grp(m.group)&&plan(grp(m.group).plan))||null;

/* sesje i obecność */
function sesMembers(s){const ids=new Set(s.mids||[]);if(s.gid)S.members.filter(m=>m.group===s.gid).forEach(m=>ids.add(m.id));return [...ids].map(mem).filter(Boolean)}
function occsOn(d){const out=[];S.ses.forEach(x=>{if(!x.rep){if(x.d===d)out.push({x,d,c:false})}else if(d>=x.d&&(!x.end||d<=x.end)&&dsd(x.d,d)%7===0)out.push({x,d,c:x.skip.includes(d)})});return out.sort((a,b)=>(a.x.t||'99').localeCompare(b.x.t||'99'))}
function occsRange(a,b){const o=[];for(let d=a,n=0;d<=b&&n<800;d=addDays(d,1),n++)occsOn(d).forEach(x=>o.push(x));return o}
const aKey=(sid,d)=>sid+'|'+d;
const attOf=(sid,d)=>S.att[aKey(sid,d)]||{};
function sesLabel(s){return s.title||(s.gid&&grp(s.gid)?grp(s.gid).name:'Trening')}
function stats(mid,from,to){let p=0,n=0,u=0,un=0;occsRange(from,to).forEach(o=>{if(o.c)return;if(!sesMembers(o.x).some(m=>m.id===mid))return;const v=attOf(o.x.id,o.d)[mid];if(v==='p')p++;else if(v==='n')n++;else if(v==='u')u++;else if(o.d<=localDay())un++});const wf=mon(from),z=doneList(mid).filter(x=>x.w>=wf&&x.w<=to).length;return{p,n,u,un,z,pc:pct(p,p+n)}}
function firstDay(){let f=localDay();S.ses.forEach(s=>{if(s.d<f)f=s.d});return f}
function periodFrom(){return stP==='all'?firstDay():addDays(localDay(),-(stP-1))}

/* okno modalne */
function pmOpen(head,body){let o=$('pmo');if(!o){o=document.createElement('div');o.id='pmo';document.body.appendChild(o)}o.onclick=ev=>{if(ev.target===o)pmClose()};o.innerHTML=`<div class="awb"><div class="awh"><div>${head}</div><button class="s" onclick="pmClose()">Zamknij</button></div><div class="awc">${body}</div></div>`}
function pmClose(){const o=$('pmo');if(o)o.remove()}
function tmIn(id,v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||''),h=m?+m[1]:-1,mi=m?m[2]:'00',ms=['00','05','10','15','20','25','30','35','40','45','50','55'];if(m&&!ms.includes(mi))ms.push(mi),ms.sort();
return `<span class="tmp"><input type="hidden" id="${id}" value="${esc(v||'')}"><select id="${id}_h" onchange="tmSet('${id}')" aria-label="Godzina"><option value="">--</option>${Array.from({length:24},(_,i)=>`<option value="${String(i).padStart(2,'0')}" ${i===h?'selected':''}>${String(i).padStart(2,'0')}</option>`).join('')}</select><b>:</b><select id="${id}_m" onchange="tmSet('${id}')" aria-label="Minuty">${ms.map(x=>`<option ${x===mi?'selected':''}>${x}</option>`).join('')}</select></span>`}
function tmSet(id){const h=$(id+'_h').value,m=$(id+'_m').value;$(id).value=h?h+':'+m:''}

async function lgGo(){lgErr='';const e=($('lge').value||'').trim(),p=$('lgp').value;if(!e||!p){lgErr='Wpisz e-mail i hasło.';return render(true)}const bt=document.querySelector('.lgcard button.pr');if(bt){bt.disabled=true;bt.textContent='Proszę czekać…'}
if(lgMode==='c'&&lgSub==='up'){const n=($('lgn').value||'').trim(),c=($('lgc').value||'').trim().toUpperCase().replace(/\s/g,'');if(!n){lgErr='Wpisz imię i nazwisko.';return render(true)}if(!c){lgErr='Wpisz kod od trenerki.';return render(true)}
let done,nu;pendingJoin=new Promise(r=>done=r);try{nu=await BE.signUp(e,p)}catch(x){pendingJoin=null;done();lgErr=aerr(x);return render(true)}
try{await joinDo(c,n,nu)}catch(x){lgErr=x.message||aerr(x)}finally{const pj=done;pendingJoin=null;pj()}return}

const d={mid:jc.mid||u.uid,gid:jc.gid||'',code:c,name:n,email:u.email,joined:Date.now(),marks:{},logs:{},rd:{},res:[]};await BE.set('athletes/'+u.uid,d)}
async function joinGo(){lgErr='';const n=($('jnm').value||'').trim(),c=($('jcd').value||'').trim().toUpperCase().replace(/\s/g,'');if(!n||!c){lgErr='Wpisz imię i nazwisko oraz kod.';return render(true)}
try{await joinDo(c,n);const a=await BE.get('athletes/'+authU.uid);role='c';athDoc=a;sess={r:'c',id:a.mid};startAthlete();render(true)}catch(x){lgErr=x.message||aerr(x);render(true)}}

let teamSel='';
function teamV(){const G=S.groups;if(teamSel&&teamSel!=='none'&&!grp(teamSel))teamSel='';const from=addDays(localDay(),-29),to=localDay();
const L=teamSel==='none'?S.members.filter(m=>!grp(m.group)):teamSel?S.members.filter(m=>m.group===teamSel):S.members;
const g=grp(teamSel),noneN=S.members.filter(m=>!grp(m.group)).length;
const mRow=m=>{const st=stats(m.id,from,to),pl=memPlan(m);return `<div class="pvrow" style="align-items:center;cursor:pointer" onclick="openM('${m.id}')"><span><b style="font-weight:500">${esc(m.name)}</b><div class="mu">${!teamSel&&grp(m.group)?esc(grp(m.group).name)+' · ':''}${pl?esc(pl.n):'bez planu'}</div></span><span class="pvnum">${st.pc==null?'—':`<b style="color:var(--ac);font-weight:500">${st.pc}%</b> obecności`}<div class="mu" style="font-size:12px">ostatnie 30 dni</div></span></div>`};
return `<div class="csub"><button class="${!teamSel?'on':''}" onclick="teamSel='';render()">Wszyscy (${S.members.length})</button>${G.map(x=>`<button class="${teamSel===x.id?'on':''}" onclick="teamSel='${x.id}';render()">${esc(x.name)} (${S.members.filter(m=>m.group===x.id).length})</button>`).join('')}${noneN&&G.length?`<button class="${teamSel==='none'?'on':''}" onclick="teamSel='none';render()">Bez drużyny (${noneN})</button>`:''}<button onclick="newTeam()">+ Nowa drużyna</button></div>`
+(g?`<div class="hero" style="margin-top:6px"><div class="row" style="align-items:flex-start;flex-wrap:wrap;gap:14px"><div><div class="mu">Drużyna</div><div class="big" style="font-size:40px;margin:6px 0 10px">${esc(g.name)}</div><div class="mu">${L.length} zawodników · plan: ${plan(g.plan)?esc(plan(g.plan).n):'brak'}</div></div><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="pr" onclick="assignDlg('${g.id}')">Przypisz zawodników</button><button onclick="editG('${g.id}')">Edytuj drużynę</button></span></div></div>`:'')
+`<div class="cd"${g?' style="margin-top:22px"':''}><h2>Nowy zawodnik</h2><div class="g"><label>Imię i nazwisko<input id="nm" placeholder="np. Anna Kowalska" onkeydown="if(event.key==='Enter')addM()"></label><label>Drużyna<select id="ng"><option value="">— bez drużyny —</option>${G.map(x=>`<option value="${x.id}" ${teamSel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><p><button class="pr" onclick="addM()">Dodaj zawodnika</button></p></div>`
+`<div class="cd"><h2>${g?'Skład drużyny':teamSel==='none'?'Bez drużyny':'Wszyscy zawodnicy'}</h2>${L.map(mRow).join('')||`<p class="mu">${g?'W tej drużynie nie ma jeszcze nikogo. Użyj „Przypisz zawodników” albo dodaj nową osobę powyżej.':'Brak zawodników. Dodaj pierwszą osobę powyżej.'}</p>`}</div>`
+(G.length?'':`<p class="mu hint">Prowadzisz kilka drużyn? Utwórz je przyciskiem „+ Nowa drużyna”, a potem przypisz do nich zawodników.</p>`)}
function newTeam(){pmOpen('<div style="font-size:22px">Nowa drużyna</div>',`<div class="g"><label>Nazwa drużyny<input id="gn" placeholder="np. Drużyna seniorek" onkeydown="if(event.key==='Enter')addG()"></label><label>Plan treningowy drużyny<select id="gp"><option value="">— brak —</option>${S.plans.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></label></div><p id="gerr" class="calwarn" style="margin:12px 0 0"></p><p><button class="pr" onclick="addG()">Utwórz drużynę</button> <button onclick="pmClose()">Anuluj</button></p>`);setTimeout(()=>{const i=$('gn');if(i)i.focus()},30)}

function assignDlg(id){const g=grp(id),M=S.members.slice().sort((a,b)=>(a.group===id?0:1)-(b.group===id?0:1)||a.name.localeCompare(b.name,'pl'));

function saveG(id){const g=grp(id);g.name=($('egn').value||'').trim()||g.name;g.plan=$('egp').value;pmClose();render()}
function delG(id){return ask('Usunąć drużynę? Zawodnicy zostaną w aplikacji bez drużyny.',()=>{S.groups=S.groups.filter(g=>g.id!==id);S.members.forEach(m=>{if(m.group===id)m.group=''});S.ses.forEach(s=>{if(s.gid===id)s.gid=''});teamSel='';render()})}

function addE(){const n=($('en').value||'').trim(),c=($('ec').value||'').trim()||'Inne',y=ytOk($('ey').value),d=($('ed').value||'').trim();if(!n){msg='Wpisz nazwę ćwiczenia.';return render()}if(y===null){msg='To nie wygląda na link do YouTube.';return render()}if(S.ex.some(e=>e.n.toLowerCase()===n.toLowerCase())){msg='Takie ćwiczenie już jest w bazie.';return render()}const e={id:uid(),n,c};if(y)e.yt=y;if(d)e.d=d;S.ex.push(e);msg='Dodano: '+n+'.';render()}

else if(st===3){const roleOf=id=>g.q.main.includes(id)?'main':g.q.sec.includes(id)?'sec':g.q.micro.includes(id)?'micro':'',R=g.q.auto?autoQ(g):g.q,nm=a=>a.length?a.map(id=>qShort(QID[id])).join(', '):'—';
